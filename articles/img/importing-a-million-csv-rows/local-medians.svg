<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
<title id="title">Local median CSV import durations</title>
<desc id="desc">Logarithmic duration chart of local median CSV import times. PostgreSQL: Scriptella unbatched 177.669 seconds, batch 1000 14.792 seconds, JDBC unbatched 176.834 seconds, batch 1000 13.631 seconds, csvsql 557.945 seconds, COPY 1.672 seconds. MariaDB: Scriptella unbatched 220.081 seconds, batch 1000 9.523 seconds, JDBC unbatched 205.926 seconds, batch 1000 6.649 seconds, csvsql 597.053 seconds.</desc>
