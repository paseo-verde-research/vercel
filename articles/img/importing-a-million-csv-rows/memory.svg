<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
<title id="title">Approximate MariaDB importer memory</title>
<desc id="desc">Linear chart of approximate process resident high-water marks from the first local MariaDB run: batched Scriptella about 188 MiB, batched JDBC about 146 MiB, csvsql about 895 MiB.</desc>
<rect width="640" height="340" fill="#101d16"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28.0" y="40.0" fill="#f4faf6" font-size="22" font-weight="700" text-anchor="start">Process memory, MariaDB</text>
<text x="28.0" y="66.0" fill="#9fb3a6" font-size="14" font-weight="400" text-anchor="start">First local run  ·  linear axis  ·  lower is smaller</text>
<line x1="210.0" y1="100" x2="210.0" y2="234" stroke="#2c4036" stroke-width="1"/>
<line x1="280.0" y1="100" x2="280.0" y2="234" stroke="#2c4036" stroke-width="1"/>
<line x1="350.0" y1="100" x2="350.0" y2="234" stroke="#2c4036" stroke-width="1"/>
<line x1="420.0" y1="100" x2="420.0" y2="234" stroke="#2c4036" stroke-width="1"/>
<line x1="490.0" y1="100" x2="490.0" y2="234" stroke="#2c4036" stroke-width="1"/>
<rect x="210" y="112" width="52.6" height="18" rx="3" fill="#2ECC71"/>
<text x="28.0" y="126.0" fill="#e7f2eb" font-size="14" font-weight="400" text-anchor="start">Scriptella, batch 1000</text>
<text x="270.6" y="126.0" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="start">≈ 188 MiB</text>
<rect x="210" y="160" width="40.9" height="18" rx="3" fill="#5dade2"/>
<text x="28.0" y="174.0" fill="#e7f2eb" font-size="14" font-weight="400" text-anchor="start">JDBC, batch 1000</text>
<text x="258.9" y="174.0" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="start">≈ 146 MiB</text>
<rect x="210" y="208" width="250.6" height="18" rx="3" fill="#d4a24c"/>
<text x="28.0" y="222.0" fill="#e7f2eb" font-size="14" font-weight="400" text-anchor="start">csvsql, chunk 1000</text>
<text x="468.6" y="222.0" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="start">≈ 895 MiB</text>
<text x="210.0" y="266.0" fill="#9fb3a6" font-size="12" font-weight="400" text-anchor="middle">0</text>
<text x="280.0" y="266.0" fill="#9fb3a6" font-size="12" font-weight="400" text-anchor="middle">250</text>
<text x="350.0" y="266.0" fill="#9fb3a6" font-size="12" font-weight="400" text-anchor="middle">500</text>
<text x="420.0" y="266.0" fill="#9fb3a6" font-size="12" font-weight="400" text-anchor="middle">750</text>
<text x="490.0" y="266.0" fill="#9fb3a6" font-size="12" font-weight="400" text-anchor="middle">1000</text>
<text x="350.0" y="286.0" fill="#9fb3a6" font-size="12" font-weight="400" text-anchor="middle">Observed resident high-water mark, MiB</text>
<text x="28.0" y="318.0" fill="#9fb3a6" font-size="13" font-weight="400" text-anchor="start">Whole importer process. Not Java heap, database, or container memory.</text>
</g>
</svg>
