<svg xmlns="http://www.w3.org/2000/svg" width="640" height="618" viewBox="0 0 640 618" role="img" aria-labelledby="title desc">
<title id="title">Individual batched CSV import runs</title>
<desc id="desc">Linear chart of the two batched local runs, from zero to 18 seconds. PostgreSQL Scriptella 13.376 and 16.208 seconds; JDBC 13.286 and 13.976 seconds. MariaDB Scriptella 8.644 and 10.403 seconds; JDBC 6.818 and 6.480 seconds.</desc>
