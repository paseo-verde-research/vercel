<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Monitoring applications behind Caddy</title>
  <desc id="description">Caddy forwards requests to Express and Spring Boot. StatLite polls Caddy for per-host HTTP metrics. The chart is illustrative.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#93dcb2" stroke-opacity=".035"/></pattern>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101b17"/><stop offset="1" stop-color="#080e0c"/></linearGradient>
    <linearGradient id="proxy" x2="1" y2="1"><stop stop-color="#193a2a"/><stop offset="1" stop-color="#11251c"/></linearGradient>
    <marker id="http-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#89a496" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="metrics-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#39d980" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1144" y="59" text-anchor="end" fill="#e6eeea" font-size="25" font-weight="700"><tspan fill="#39d980">PVR</tspan>Labs</text>
    <text x="56" y="126" fill="#f0f5f2" font-size="53" font-weight="700" letter-spacing="-1.7">Monitoring applications</text>
    <text x="56" y="194" fill="#39d980" font-size="64" font-weight="700" letter-spacing="-2">behind Caddy</text>
    <text x="58" y="239" fill="#a3b7ac" font-size="27">HTTP visibility with StatLite</text>

    <!-- HTTP traffic follows solid paths; metrics use a separate dashed path. -->
    <g fill="none" stroke="#89a496" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M65 380h149" marker-end="url(#http-arrow)"/>
      <path d="M460 380h65V329h49" marker-end="url(#http-arrow)"/>
      <path d="M525 380v61h49" marker-end="url(#http-arrow)"/>
    </g>
    <circle cx="525" cy="380" r="4" fill="#89a496"/>
    <text x="65" y="357" fill="#a3b7ac" font-size="21">Requests</text>

    <rect x="220" y="298" width="240" height="170" rx="20" fill="url(#proxy)" stroke="#39d980" stroke-opacity=".65" stroke-width="1.5"/>
    <rect x="245" y="322" width="34" height="34" rx="9" fill="#39d980" fill-opacity=".12"/>
    <path d="M254 339h15m-5-6 6 6-6 6" fill="none" stroke="#64e79c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="245" y="399" fill="#f0f5f2" font-size="39" font-weight="700">Caddy</text>
    <text x="245" y="434" fill="#adc7b7" font-size="21">Reverse proxy</text>

    <rect x="580" y="285" width="245" height="88" rx="16" fill="#121e18" stroke="#34473c"/>
    <circle cx="606" cy="329" r="5" fill="#91b6a0"/>
    <text x="626" y="338" fill="#e4ede7" font-size="28" font-weight="600">Express</text>
    <rect x="580" y="397" width="245" height="88" rx="16" fill="#121e18" stroke="#34473c"/>
    <circle cx="606" cy="441" r="5" fill="#91b6a0"/>
    <text x="626" y="450" fill="#e4ede7" font-size="28" font-weight="600">Spring Boot</text>

    <path d="M1030 515v30H340v-71" fill="none" stroke="#39d980" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#metrics-arrow)"/>
    <rect x="496" y="527" width="313" height="35" rx="12" fill="#0b1410"/>
    <text x="652" y="551" text-anchor="middle" fill="#6ee6a0" font-size="21">Poll per-host HTTP metrics</text>

    <rect x="900" y="285" width="244" height="230" rx="20" fill="#111e17" stroke="#39d980" stroke-opacity=".5"/>
    <text x="925" y="328" fill="#e8f2ec" font-size="29" font-weight="700"><tspan fill="#39d980">Stat</tspan>Lite</text>
    <text x="925" y="355" fill="#99b2a3" font-size="18">HTTP history</text>
    <path d="M926 391h192m-192 35h192m-192 35h192" stroke="#294235" stroke-width="1"/>
    <path d="M937 425v-27m13 27v-42m13 42v-32m17 32v-19m13 19v-36m13 36v-28" stroke="#e6ac57" stroke-width="5" stroke-linecap="round"/>
    <path d="M929 456h65c9 0 10-48 21-48h33c12 0 11 48 24 48h44" fill="none" stroke="#39d980" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="925" y="493" fill="#99b2a3" font-size="17">Errors · Latency · Recovery</text>
  </g>
</svg>
