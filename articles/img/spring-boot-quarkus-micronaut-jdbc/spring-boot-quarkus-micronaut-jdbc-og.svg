<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Spring Boot, Quarkus, and Micronaut: JDBC on a 1 GiB VM</title>
<desc id="desc">A Java 25 experiment comparing startup, resident memory, and CPU. Median RSS: Spring Boot 214.3 MiB, Quarkus 178.4 MiB, Micronaut 186.7 MiB.</desc>
