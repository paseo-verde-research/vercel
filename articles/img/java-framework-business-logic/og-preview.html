<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Java stacks social preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; padding: 56px 64px 48px; color: #f3f5f3; font-family: Arial, sans-serif; background-color: #080c09; background-image: linear-gradient(#ffffff04 1px, transparent 1px), linear-gradient(90deg, #ffffff04 1px, transparent 1px); background-size: 40px 40px; }
.logo { width: 92px; height: 26px; background: linear-gradient(90deg, #2ecc71 49%, #f3f5f3 49%); mask: url('../../../img/pvrlabs_alpha_bg.png') center / contain no-repeat; }
.series { margin-top: 12px; color: #a1a6a3; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
h1 { margin: 86px 0 0; font-size: 48px; line-height: 1.08; letter-spacing: -1.8px; }
h1 span { color: #2ecc71; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 100px; }
.result { padding: 18px 20px; border: 1px solid #303631; border-radius: 13px; background: #141815; }
.result strong { display: block; margin-bottom: 8px; color: #2ecc71; font-size: 23px; letter-spacing: -.6px; white-space: nowrap; }
.result span { color: #b7beba; font-size: 15px; }
footer { display: flex; justify-content: space-between; margin-top: 69px; color: #98a19b; font-size: 15px; }
</style>
</head>
<body>
<div class="logo" role="img" aria-label="PVR Labs"></div>
<div class="series">ENGINEERING NOTES</div>
<h1>Shared business logic.<br><span>Five Java stacks.</span></h1>
<div class="results">
<div class="result"><strong>3 HTTP hosts</strong><span>Shared services and repositories</span></div>
<div class="result"><strong>512 MiB VM</strong><span>Application + MariaDB</span></div>
<div class="result"><strong>HotSpot + native</strong><span>Two runs per stack and runtime</span></div>
</div>
<footer><span>pvrlabs.xyz</span><span>Light synthetic workload · 5 requests/second</span></footer>
</body>
</html>
