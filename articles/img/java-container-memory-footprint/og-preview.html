<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Container Memory Footprint social preview</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    width: 1200px;
    height: 630px;
    padding: 48px 64px;
    color: #f3f5f3;
    font-family: Arial, sans-serif;
    background-color: #080e0a;
    background-image: linear-gradient(#ffffff04 1px, transparent 1px), linear-gradient(90deg, #ffffff04 1px, transparent 1px);
    background-size: 46px 46px;
}
.logo {
    width: 152px;
    height: 38px;
    background: linear-gradient(90deg, #31c779 49%, #f3f5f3 49%);
    mask: url('../../../img/pvrlabs_alpha_bg.png') center / contain no-repeat;
}
.series { margin-top: 4px; color: #a5afa8; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
h1 { margin: 56px 0 12px; font-size: 54px; line-height: 1.12; letter-spacing: -1.5px; }
.subtitle { margin: 0; color: #31c779; font-size: 38px; font-weight: 700; letter-spacing: -.6px; }
.comparison { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; margin-top: 32px; }
.host { padding: 17px 22px 22px; border: 1px solid #63756a; border-radius: 14px; background: #111812; }
.host-caption { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #384139; color: #c0c8c2; font-size: 20px; font-weight: 700; }
.host-caption::after {
    content: "";
    display: block;
    width: 9px;
    height: 9px;
    margin-left: auto;
    border-radius: 50%;
    background: #31c779;
}
.apps { display: grid; grid-template-rows: repeat(2, 50px); gap: 8px; margin-top: 14px; }
.roomier { grid-template-columns: repeat(3, 1fr); }
.compact { grid-template-columns: repeat(4, 1fr); }
.app {
    display: grid;
    place-items: center;
    border: 1px solid #65796e;
    border-radius: 6px;
    background: #24332b;
    font-size: 21px;
    font-weight: 700;
}
.compact .app { border-color: #3dac71; background: #163d29; }
.arrow { color: #31c779; font-size: 38px; }
footer { margin-top: 28px; color: #a5afa8; font-size: 16px; }
</style>
</head>
<body>
<div class="logo" role="img" aria-label="PVR Labs"></div>
<div class="series">ENGINEERING NOTES</div>
<h1>Java Container Memory Footprint</h1>
<p class="subtitle">More Applications. Same Hardware.</p>
<div class="comparison" role="img" aria-label="Illustrative comparison of two hosts with the same memory budget. The first holds fewer large application blocks. The second fits more compact application blocks.">
    <div class="host" aria-hidden="true">
        <div class="host-caption">Same memory budget</div>
        <div class="apps roomier">
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
        </div>
    </div>
    <span class="arrow" aria-hidden="true">&rarr;</span>
    <div class="host" aria-hidden="true">
        <div class="host-caption">Same memory budget</div>
        <div class="apps compact">
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
            <div class="app">App</div>
        </div>
    </div>
</div>
<footer>pvrlabs.xyz · Illustrative comparison</footer>
</body>
</html>
