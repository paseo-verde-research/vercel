<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spring Boot Actuator metrics social preview</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    width: 1200px;
    height: 630px;
    padding: 54px 64px 44px;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at top right, #163329, #0b100e 72%);
    color: #f1f5f2;
    font-family: Arial, sans-serif;
}
.logo {
    width: 128px;
    height: 36px;
    background: linear-gradient(90deg, #2ecc71 49%, #f3f5f3 49%);
    mask: url('../../../img/pvrlabs_alpha_bg.png') center / contain no-repeat;
}
h1 { margin: 50px 0 40px; font-size: 67px; line-height: 1.04; letter-spacing: -2.5px; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
section { padding: 30px; border: 1px solid #3a5547; border-radius: 16px; background: #121e18; }
section:last-child { background: #173326; border-color: #4a8162; }
h2 { margin: 0 0 14px; color: #84e7ad; font: 700 29px Menlo, monospace; }
p { margin: 0; font-size: 27px; }
footer { margin-top: auto; color: #a9b9af; font-size: 20px; }
</style>
</head>
<body>
<header><div class="logo" role="img" aria-label="PVR Labs"></div></header>
<h1>Spring Boot Actuator<br>Metrics vs. Prometheus</h1>
<main>
    <section><h2>/actuator/metrics</h2><p>Inspect a meter</p></section>
    <section><h2>/actuator/prometheus</h2><p>Scrape metrics over time</p></section>
</main>
<footer>pvrlabs.xyz</footer>
</body>
</html>
