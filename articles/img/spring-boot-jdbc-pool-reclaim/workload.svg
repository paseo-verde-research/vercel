<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
<title id="title">Requests stop, idle retention is measured, then traffic returns</title>
<desc id="desc">App A receives traffic from 0 to 16 seconds. App B receives traffic from 12 to 68 seconds. Both are quiet from 68 seconds until new requests arrive for A at 128 seconds and B at 130 seconds. Idle connections and PostgreSQL memory are measured from 118 to 128 seconds, before returning traffic.</desc>
<rect width="1100" height="550" rx="12" fill="#101b2b"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#e6edf5">
<text x="38" y="48" font-size="26" font-weight="700">Traffic stops, pools settle, then traffic returns</text>
<text x="38" y="80" font-size="17" fill="#aebed0">Two apps, one timeline. Colored bars mean requests are arriving.</text><path d="M155.0 139V130H556.2V139" fill="none" stroke="#72b8ff" stroke-width="2"/><text x="355.6" y="119" text-anchor="middle" font-size="16" fill="#72b8ff">1. Send overlapping bursts</text><path d="M556.2 139V130H851.2V139" fill="none" stroke="#b7c4d3" stroke-width="2"/><text x="703.7" y="119" text-anchor="middle" font-size="16" fill="#b7c4d3">2. Let both apps sit idle</text><rect x="556.2" y="160" width="354.0" height="160" fill="#263246"/><rect x="851.2" y="160" width="59.0" height="160" fill="#64dca0" opacity=".22"/><text x="38" y="204" font-size="20" font-weight="700">App A</text><path d="M155.0 198H1004.6" stroke="#526178" stroke-width="2"/><rect x="155.0" y="182" width="94.4" height="32" rx="5" fill="#64dca0"/><text x="261.4" y="204" font-size="16" fill="#64dca0">Burst ends at 16 s</text><text x="38" y="284" font-size="20" font-weight="700">App B</text><path d="M155.0 278H1004.6" stroke="#526178" stroke-width="2"/><rect x="225.8" y="262" width="330.40000000000003" height="32" rx="5" fill="#72b8ff"/><text x="568.2" y="284" font-size="16" fill="#72b8ff">Burst ends at 68 s</text><circle cx="910.2" cy="198" r="7" fill="#64dca0"/><circle cx="922.0" cy="278" r="7" fill="#72b8ff"/><text x="703.7" y="243" text-anchor="middle" font-size="18" fill="#d8e3ef">No workload requests</text><path d="M155.0 327v8" stroke="#8293a8"/><text x="155.0" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">0</text><path d="M249.4 327v8" stroke="#8293a8"/><text x="249.4" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">16</text><path d="M391.0 327v8" stroke="#8293a8"/><text x="391.0" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">40</text><path d="M556.2 327v8" stroke="#8293a8"/><text x="556.2" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">68</text><path d="M745.0 327v8" stroke="#8293a8"/><text x="745.0" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">100</text><path d="M851.2 327v8" stroke="#8293a8"/><text x="851.2" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">118</text><path d="M910.2 327v8" stroke="#8293a8"/><text x="910.2" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">128</text><path d="M1004.6 327v8" stroke="#8293a8"/><text x="1004.6" y="355" text-anchor="middle" font-size="14" fill="#b7c4d3">144</text><text x="38" y="355" font-size="14" fill="#b7c4d3">Seconds</text><path d="M880.7 319V374H600V400" stroke="#64dca0" fill="none" stroke-width="2"/><path d="M922.0 291V383H905V400" stroke="#efa760" fill="none" stroke-width="2"/><rect x="38" y="408" width="663" height="105" rx="9" fill="#183a2b" stroke="#64dca0"/>
<text x="58" y="438" font-size="19" font-weight="700" fill="#64dca0">3. Measure what stays: 118–128 seconds</text>
<text x="58" y="467" font-size="17">Count idle connections and measure PostgreSQL memory.</text>
<text x="58" y="493" font-size="17">This is the 20 vs 2 comparison, before traffic returns.</text>
<rect x="719" y="408" width="343" height="105" rx="9" fill="#342c24" stroke="#efa760"/>
<text x="739" y="438" font-size="19" font-weight="700" fill="#efa760">4. Traffic returns</text>
<text x="739" y="467" font-size="17">A: 128 s · B: 130 s</text>
<text x="739" y="493" font-size="17">Ten new requests per app.</text>
</g></svg>