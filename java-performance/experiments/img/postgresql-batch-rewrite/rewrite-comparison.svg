<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">PostgreSQL batch rewriting narrows the gap</title>
<desc id="chart-desc">Median seconds for one million rows, three runs per configuration. Scriptella: PostgreSQL rewriting off 15.995, on 9.409, MariaDB 8.688. JDBC: PostgreSQL rewriting off 11.333, on 7.290, MariaDB 5.571. Linear axis from zero to 18. Lower is faster.</desc>
<rect width="760" height="482" fill="#101d16"/>
<g font-family="system-ui, Segoe UI, Arial, sans-serif">
<text x="28" y="38" fill="#f4faf6" font-size="22" font-weight="700">PostgreSQL batch rewriting narrows the gap</text>
<text x="28" y="62" fill="#9fb3a6" font-size="14">One million rows · batch size 1000 · median of three runs</text>

<text x="28" y="104" fill="#f4faf6" font-size="16" font-weight="700">Scriptella 1.6</text>
<line x1="280" y1="118" x2="280" y2="232" stroke="#2c4036"/>
<line x1="380" y1="118" x2="380" y2="232" stroke="#2c4036"/>
<line x1="480" y1="118" x2="480" y2="232" stroke="#2c4036"/>
<line x1="580" y1="118" x2="580" y2="232" stroke="#2c4036"/>
<line x1="640" y1="118" x2="640" y2="232" stroke="#2c4036"/>
<rect x="280" y="126" width="319.9" height="18" rx="4" fill="#d08a4c"/>
<text x="268" y="140" fill="#e7f2eb" font-size="15" text-anchor="end">PostgreSQL, rewriting off</text>
<text x="736" y="140" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="end">15.995 s</text>
<rect x="280" y="166" width="188.2" height="18" rx="4" fill="#2ECC71"/>
<text x="268" y="180" fill="#e7f2eb" font-size="15" text-anchor="end">PostgreSQL, rewriting on</text>
<text x="736" y="180" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="end">9.409 s</text>
<rect x="280" y="206" width="173.8" height="18" rx="4" fill="#5dade2"/>
<text x="268" y="220" fill="#e7f2eb" font-size="15" text-anchor="end">MariaDB, unchanged</text>
<text x="736" y="220" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="end">8.688 s</text>
<text x="280" y="252" fill="#9fb3a6" font-size="12" text-anchor="middle">0</text>
<text x="380" y="252" fill="#9fb3a6" font-size="12" text-anchor="middle">5</text>
<text x="480" y="252" fill="#9fb3a6" font-size="12" text-anchor="middle">10</text>
<text x="580" y="252" fill="#9fb3a6" font-size="12" text-anchor="middle">15</text>
<text x="640" y="252" fill="#9fb3a6" font-size="12" text-anchor="middle">18</text>

<text x="28" y="300" fill="#f4faf6" font-size="16" font-weight="700">Handwritten JDBC</text>
<line x1="280" y1="314" x2="280" y2="428" stroke="#2c4036"/>
<line x1="380" y1="314" x2="380" y2="428" stroke="#2c4036"/>
<line x1="480" y1="314" x2="480" y2="428" stroke="#2c4036"/>
<line x1="580" y1="314" x2="580" y2="428" stroke="#2c4036"/>
<line x1="640" y1="314" x2="640" y2="428" stroke="#2c4036"/>
<rect x="280" y="322" width="226.7" height="18" rx="4" fill="#d08a4c"/>
<text x="268" y="336" fill="#e7f2eb" font-size="15" text-anchor="end">PostgreSQL, rewriting off</text>
<text x="736" y="336" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="end">11.333 s</text>
<rect x="280" y="362" width="145.8" height="18" rx="4" fill="#2ECC71"/>
<text x="268" y="376" fill="#e7f2eb" font-size="15" text-anchor="end">PostgreSQL, rewriting on</text>
<text x="736" y="376" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="end">7.290 s</text>
<rect x="280" y="402" width="111.4" height="18" rx="4" fill="#5dade2"/>
<text x="268" y="416" fill="#e7f2eb" font-size="15" text-anchor="end">MariaDB, unchanged</text>
<text x="736" y="416" fill="#f4faf6" font-size="14" font-weight="700" text-anchor="end">5.571 s</text>
<text x="280" y="448" fill="#9fb3a6" font-size="12" text-anchor="middle">0</text>
<text x="380" y="448" fill="#9fb3a6" font-size="12" text-anchor="middle">5</text>
<text x="480" y="448" fill="#9fb3a6" font-size="12" text-anchor="middle">10</text>
<text x="580" y="448" fill="#9fb3a6" font-size="12" text-anchor="middle">15</text>
<text x="640" y="448" fill="#9fb3a6" font-size="12" text-anchor="middle">18</text>
<text x="460" y="470" fill="#9fb3a6" font-size="12" text-anchor="middle">Seconds · lower is faster</text>
</g>
</svg>
