<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Process RSS and swap under load</title><desc id="desc">CoilBase (Jex + Jdbi): Temurin (HotSpot) 92.8 MiB RSS and zero swap; Semeru (OpenJ9) 81.1 RSS and 8.8 swap. Spring: Temurin (HotSpot) 118.6 RSS and 70.6 swap; Semeru (OpenJ9) 121.9 RSS and 19.4 swap. Values are separate nine-sample medians.</desc>
