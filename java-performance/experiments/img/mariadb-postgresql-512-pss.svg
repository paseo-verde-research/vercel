<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Peak database process PSS on 512 MiB VMs</title>
<desc id="desc">MariaDB and PostgreSQL stock, A and B configurations in separate workloads; values in MiB.</desc>
<rect width="800" height="400" fill="#0a0a0a"/><g font-family="Arial, Helvetica, sans-serif" fill="#ededed">
<text x="50" y="30" font-size="20" font-weight="bold">Peak process PSS on 512 MiB VMs</text>
<text x="50" y="53" font-size="13">MiB; separate workloads, one run each</text>
<line x1="65" y1="310" x2="755" y2="310" stroke="#424b47"/><text x="55" y="315" text-anchor="end" font-size="13">0</text>
<line x1="65" y1="260" x2="755" y2="260" stroke="#424b47"/><text x="55" y="265" text-anchor="end" font-size="13">50</text>
