<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="title desc">
<title id="title">Moderate-load mean resident memory</title>
<desc id="desc">H2 native: A1 111.05 MiB, A2 110.85 MiB. HikariCP: B1 109.05 MiB, B2 109.80 MiB. Horizontal axis runs from 108 to 112 MiB, not zero.</desc>
<rect width="800" height="230" rx="8" fill="#0b100d"/>
<g font-family="Arial, sans-serif" fill="#e4eee7">
<text x="16" y="28" font-size="18" font-weight="bold">Moderate-load mean RSS</text>
<text x="16" y="48" font-size="12" fill="#c6d4ca">Each dot is one run · axis starts at 108 MiB</text>
<g stroke="#526459" stroke-width="1"><path d="M120 68V188 M275 68V188 M430 68V188 M585 68V188 M740 68V188" opacity=".55"/><path d="M120 188H740"/></g>
<g font-size="13"><text x="16" y="92">H2 native</text><text x="16" y="150">HikariCP</text></g>
<g font-size="12" fill="#c6d4ca" text-anchor="middle"><text x="120" y="207">108</text><text x="275" y="207">109</text><text x="430" y="207">110</text><text x="585" y="207">111</text><text x="740" y="207">112</text><text x="430" y="226">Mean RSS (MiB), truncated scale</text></g>
<g fill="#66d58b"><circle cx="592.75" cy="84" r="5"/><circle cx="561.75" cy="108" r="5"/></g>
<g fill="#79b7f2"><circle cx="282.75" cy="142" r="5"/><circle cx="399" cy="166" r="5"/></g>
<g font-size="12"><text x="603" y="88">A1 111.05</text><text x="572" y="112">A2 110.85</text><text x="293" y="146">B1 109.05</text><text x="410" y="170">B2 109.80</text></g>
</g></svg>
