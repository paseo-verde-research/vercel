<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-labelledby="title desc">
<title id="title">Moderate-load mean resident memory</title>
<desc id="desc">H2 native: A1 111.05 MiB, A2 110.85 MiB. HikariCP: B1 109.05 MiB, B2 109.80 MiB. Horizontal axis runs from 108 to 112 MiB, not zero.</desc>
<rect width="400" height="310" rx="8" fill="#0b100d"/>
<g font-family="Arial, sans-serif" fill="#e4eee7">
<text x="16" y="28" font-size="18" font-weight="bold">Moderate-load mean RSS</text>
<text x="16" y="48" font-size="12" fill="#c6d4ca">Each dot is one run · axis starts at 108 MiB</text>
<g stroke="#526459" stroke-width="1"><path d="M95 68V246 M160 68V246 M225 68V246 M290 68V246 M355 68V246" opacity=".55"/><path d="M95 246H355"/></g>
<g font-size="13"><text x="16" y="110">H2 native</text><text x="16" y="190">HikariCP</text></g>
<g font-size="12" fill="#c6d4ca" text-anchor="middle"><text x="95" y="266">108</text><text x="160" y="266">109</text><text x="225" y="266">110</text><text x="290" y="266">111</text><text x="355" y="266">112</text><text x="225" y="290">Mean RSS (MiB), truncated scale</text></g>
<g fill="#66d58b"><circle cx="293.25" cy="102" r="5"/><circle cx="280.25" cy="135" r="5"/></g>
<g fill="#79b7f2"><circle cx="163.25" cy="182" r="5"/><circle cx="212" cy="215" r="5"/></g>
<g font-size="12"><text x="302" y="106">A1 111.05</text><text x="289" y="139">A2 110.85</text><text x="172" y="186">B1 109.05</text><text x="221" y="219">B2 109.80</text></g>
</g></svg>
