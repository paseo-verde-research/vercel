<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Badger - Install</title>
    <meta name="description" content="Install AI Badger on your machine. Local-first code context for any AI chat.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .install-section {
            padding: 80px 0;
            min-height: calc(100vh - 160px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .install-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .install-header h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }
        .install-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* New Tab Layout */
        .tabs-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
            gap: 30px;
            background: rgba(255, 255, 255, 0.02);
        }
        .tab-btn {
            background: none;
            border: none;
            color: #666;
            font-family: var(--font-body);
            font-size: 0.95rem;
            padding: 20px 0;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--text-primary);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--text-primary);
        }
        .command-box {
            padding: 35px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .command-text {
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        .command-text::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .copy-btn:hover {
            color: var(--primary-green);
        }
        .copy-btn.copied {
            color: var(--primary-green);
        }
        .copy-btn .check {
            display: none;
        }
        .copy-btn.copied .copy {
            display: none;
        }
        .copy-btn.copied .check {
            display: block;
        }

        @media (max-width: 768px) {
            .install-header h1 {
                font-size: 2rem;
            }
            .command-text {
                font-size: 0.95rem;
            }
            .tabs-header {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

<header id="header">
    <nav class="navbar">
        <div class="container">
            <div class="header-left">
                <a href="/aibadger/" class="product-logo">
                    AI <span class="highlight">Badger</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="/aibadger/" class="nav-link">Home</a></li>
                <li><a href="/aibadger/install.html" class="nav-link active">Install</a></li>
                <li><a href="/aibadger/demo.html" class="nav-link">Demo</a></li>
                <li><a href="https://github.com/PVRLabs/aibadger" class="nav-link">GitHub</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>
</header>

<main>
    <section class="install-section">
        <div class="container">
            <div class="install-header">
                <h1>Install <span class="highlight">AI Badger</span></h1>
                <p>Get started with the local-first CLI for AI code context.</p>
            </div>

            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-method="curl">curl</button>
                    <button class="tab-btn" data-method="brew">brew</button>
                </div>
                <div class="command-box">
                    <code class="command-text" id="command-text">curl -fsSL
                        https://raw.githubusercontent.com/PVRLabs/aibadger/main/install.sh | sh</code>
                    <button class="copy-btn" id="copy-btn">
                        <svg class="copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        <svg class="check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<footer id="footer">
    <div class="container">
        <p>Built at <a href="/" class="footer-brand"><span class="footer-brand-pvr">PVR</span><span class="logo-accent">Labs</span></a> · <span id="currentYear"></span></p>
    </div>
</footer>

<script src="/script.js"></script>

<script>
    const tabs = document.querySelectorAll('.tab-btn');
    const commandText = document.getElementById('command-text');
    const copyBtn = document.getElementById('copy-btn');

    const commands = {
        curl: "curl -fsSL https://raw.githubusercontent.com/PVRLabs/aibadger/main/install.sh | sh",
        brew: "brew tap pvrlabs/aibadger && brew install badger"
    };

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const method = tab.dataset.method;
            commandText.textContent = commands[method];
        });
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(commandText.textContent).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 2000);
        });
    });
</script>

</body>
</html>
